        two_op: 0.24
        majority: 0.20
        choice: 0.32
        unknown: 0.10
      overrun_p: 0.01
    text_cipher:
      difficulty_buckets: [0.10, 0.20, 0.30, 0.30, 0.10]
      first_letter_floor: 0.40
      last_word_floor: 0.40
      host_min_len: 3
      the_hidden_p: 0.20
