  seed: 42
  max_length: 8192
  evaluation_overlap: forbid
  problems_jsonl: outputs/data/synthetic_pilot/problems.jsonl
  cot_jsonl: outputs/data/synthetic_pilot/cot.jsonl
  traces_jsonl: outputs/data/synthetic_pilot/qwen_traces.jsonl
