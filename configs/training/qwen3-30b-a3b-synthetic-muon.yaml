extends: qwen3-30b-a3b-synthetic.yaml

experiment:
  name: qwen3-30b-a3b-synthetic-cot-muon
  description: Qwen3-30B-A3B LoRA SFT on synthetic CoT with pure Muon

paths:
  adapter_dir: outputs/adapters/qwen3-30b-a3b-synthetic-cot-muon

optimizer:
  name: muon
  kwargs:
    momentum: 0.95
    nesterov: true
    ns_steps: 5
    adjust_lr_fn: match_rms_adamw

training:
  output_dir: outputs/trainer/qwen3-30b-a3b-synthetic-cot-muon
  learning_rate: 2.0e-4
  weight_decay: 0.0
  lr_scheduler_kwargs:
    min_lr: 1.0e-5
