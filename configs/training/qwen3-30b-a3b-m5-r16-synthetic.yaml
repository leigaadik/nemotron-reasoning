extends: base.yaml

experiment:
  name: qwen3-30b-a3b-m5-r16-synthetic-cot
  description: Qwen3-30B-A3B bf16 LoRA (r=16, m5=attn+router) on synthetic CoT (13794 rows) — module ablation

model:
  base_model_name: Qwen/Qwen3-30B-A3B
  model_path: ./models/Qwen3-30B-A3B

paths:
  train_jsonl: outputs/data/synthetic_pilot/qwen_traces.jsonl
  adapter_dir: outputs/adapters/qwen3-30b-a3b-m5-r16-synthetic-cot

lora:
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - mlp.gate

training:
  output_dir: outputs/trainer/qwen3-30b-a3b-m5-r16-synthetic-cot
