extends: qwen3-30b-a3b-legacy.yaml

experiment:
  name: qwen3-30b-a3b-legacy-muon-ns5-lr2e-4-wd1e-2
  description: Legacy CoT LoRA with Muon NS5, lr=2e-4, weight_decay=0.01

paths:
  adapter_dir: outputs/adapters/qwen3-30b-a3b-legacy-muon-ns5-lr2e-4-wd1e-2

optimizer:
  name: muon
  kwargs:
    momentum: 0.95
    nesterov: true
    ns_steps: 5
    adjust_lr_fn: match_rms_adamw

training:
  output_dir: outputs/trainer/qwen3-30b-a3b-legacy-muon-ns5-lr2e-4-wd1e-2
  learning_rate: 2.0e-4
  weight_decay: 0.01
  lr_scheduler_kwargs:
    min_lr: 1.0e-5
