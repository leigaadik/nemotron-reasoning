extends: base.yaml

experiment:
  name: qwen3-30b-a3b-m4-r16-legacy-cot
  description: Qwen3-30B-A3B bf16 LoRA (r=16, m4=attn) on legacy CoT (9500 rows) — module ablation

model:
  base_model_name: Qwen/Qwen3-30B-A3B
  model_path: ./models/Qwen3-30B-A3B

paths:
  train_jsonl: outputs/data/legacy/qwen_traces.jsonl
  adapter_dir: outputs/adapters/qwen3-30b-a3b-m4-r16-legacy-cot

lora:
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj

training:
  output_dir: outputs/trainer/qwen3-30b-a3b-m4-r16-legacy-cot
