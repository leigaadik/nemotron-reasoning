extends: qwen3-30b-a3b-legacy.yaml

experiment:
  name: qwen3-30b-a3b-legacy-muon-optcmp
  description: Legacy CoT LoRA with the tuned Muon configuration

paths:
  adapter_dir: outputs/adapters/qwen3-30b-a3b-legacy-muon-optcmp

optimizer:
  name: muon
  kwargs:
    momentum: 0.95
    nesterov: true
    ns_steps: 5
    adjust_lr_fn: match_rms_adamw

training:
  output_dir: outputs/trainer/qwen3-30b-a3b-legacy-muon-optcmp
  learning_rate: 1.0e-3
  weight_decay: 0.05
  lr_scheduler_kwargs:
    min_lr: 5.0e-5
