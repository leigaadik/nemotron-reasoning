experiment:
  name: qwen3-30b-lora
  description: Unified Qwen3-30B-A3B LoRA SFT
  seed: 123

paths:
  train_jsonl: outputs/data/legacy/qwen_traces.jsonl
  adapter_dir: outputs/adapters/qwen3-30b-lora

model:
  base_model_name: Qwen/Qwen3-30B-A3B
  model_path: ./models/Qwen3-30B-A3B
  max_seq_length: 8192
  dtype: bfloat16
  load_in_4bit: false
  load_in_8bit: false
  trust_remote_code: true
  unsloth_force_compile: false
  attn_implementation: eager

lora:
  r: 16
  alpha: 32
  dropout: 0.0
  bias: none
  use_gradient_checkpointing: unsloth
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj

training:
  output_dir: outputs/trainer/qwen3-30b-lora
  num_train_epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine_with_min_lr
  lr_scheduler_kwargs:
    min_lr: 1.0e-5
  warmup_ratio: 0.0
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_epsilon: 1.0e-8
  weight_decay: 0.0
  max_grad_norm: 1000000000.0
  logging_steps: 10
  save_strategy: "no"
  bf16: true
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
  dataloader_num_workers: 2
  remove_unused_columns: false
  report_to: none
